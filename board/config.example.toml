# Copy to board/config.toml on the VENTUNO Q and edit. Anything left out uses the defaults
# in guardian/config.py (which are all mocks, for running on a laptop).

dev = true                         # rehearsal buttons on the dashboard; set false for the final demo
bridge = "router"                  # talk to the STM32 through /var/run/arduino-router.sock

[camera]
device = 0                         # /dev/video0; "none" disables the camera
fps = 5

[vision]
backend = "vlm"                    # "vlm" | "encoder" | "mock"
background_interval_s = 30
adsp_library_path = "/usr/lib"
timeout_s = 40

# --- vlm: InternVL3-1B multimodal runner. Placeholders: {image} {prompt}.
# The exact runner name and flags depend on the build from ventuno_executorch_source.tar.gz;
# run it with --help and adjust. answer_after = text the runner prints just before the answer.
vlm_command = "/home/arduino/executorch/cmake-out/examples/qualcomm/oss_scripts/llama/qnn_multimodal_runner --decoder_path /home/arduino/models/InternVL3-1B_QCS8275_ctxt_1000/InternVL3-1B_QCS8275_ctxt_1000.pte --encoder_path /home/arduino/models/InternVL3-1B_QCS8275_ctxt_1000/InternVL3-1B_QCS8275_ctxt_1000_vision_encoder_qnn.pte --embedding_path /home/arduino/models/InternVL3-1B_QCS8275_ctxt_1000/InternVL3-1B_QCS8275_ctxt_1000_tok_embedding_qnn.pte --tokenizer_path /home/arduino/models/InternVL3-1B_QCS8275_ctxt_1000/tokenizer.json --image_path {image} --prompt '{prompt}' --seq_len 1000"
answer_after = ""

# --- encoder: vision encoder only + your reference photos (tools/capture_refs.py)
runner = "/home/arduino/executorch/cmake-out/examples/qualcomm/executor_runner/qnn_executor_runner"
encoder_model = "/home/arduino/models/InternVL3-1B_QCS8275_ctxt_1000/InternVL3-1B_QCS8275_ctxt_1000_vision_encoder_qnn.pte"
refs_dir = "refs"
size = 448
hidden = 896                       # InternVL3-1B LLM width; output is mean-pooled over image tokens
output_pattern = "output_{i}_0.raw"

[fusion]
checkin_s = 20
verify_timeout_s = 45

[tts]
piper_bin = "/home/arduino/piper/piper"
piper_model = "/home/arduino/piper/en_US-lessac-medium.onnx"
piper_rate = 22050
