# Copy to board/config.toml on the VENTUNO Q and edit. Anything left out uses the defaults
# in guardian/config.py (which are all mocks, for running on a laptop).

dev = true                         # rehearsal buttons on the dashboard; set false for the final demo
bridge = "router"                  # talk to the STM32 through /var/run/arduino-router.sock

[camera]
device = 0                         # /dev/video0; "none" disables the camera
fps = 5

[vision]
backend = "vlm"                    # "vlm" | "encoder" | "mock"
background_interval_s = 30
adsp_library_path = "/usr/lib/dsp/cdsp:/usr/lib"
timeout_s = 30

# --- vlm: InternVL3-1B kept loaded in qnn_multimodal_persistent (from the track's ExecuTorch
# source archive, extracted to ~/git/executorch). Measured on the board: 7.9 s load once,
# ~1.4 s per check (0.86 s prefill, 37 tok/s decode), 574 MiB RSS.
vlm_runner = "/home/arduino/git/executorch/examples/qualcomm/oss_scripts/llama/qnn_multimodal_persistent"
ld_library_path = "/home/arduino/git/executorch/build-x86/lib/executorch/backends/qualcomm"
model_dir = "/home/arduino/models/InternVL3-1B_QCS8275_ctxt_1000"
model_prefix = "InternVL3-1B_QCS8275_ctxt_1000"
workdir = "data/vlm"
seq_len = 330                      # prompt (~280 tokens incl. image) + answer

# --- encoder: vision encoder only + your reference photos (tools/capture_refs.py)
runner = "/home/arduino/git/executorch/examples/qualcomm/executor_runner/qnn_executor_runner"
encoder_model = "/home/arduino/models/InternVL3-1B_QCS8275_ctxt_1000/InternVL3-1B_QCS8275_ctxt_1000_vision_encoder_qnn.pte"
refs_dir = "refs"
size = 448
hidden = 896                       # InternVL3-1B LLM width; output is mean-pooled over image tokens
output_pattern = "output_{i}_0.raw"

[fusion]
checkin_s = 20
verify_timeout_s = 15

[tts]
# Leave empty to use espeak-ng (apt). For a nicer voice install Piper and set both paths.
piper_bin = ""
piper_model = ""
piper_rate = 22050
